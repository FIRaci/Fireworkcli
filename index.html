<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal ASCII Fireworks</title>
  <meta name="description" content="Minimalist Terminal ASCII Fireworks Simulation with Alt+Q Customizer">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <div class="terminal-wrap">
    <!-- Subtle Visual Enhancements -->
    <div class="screen-vignette"></div>
    <div class="subtle-scanline"></div>

    <!-- Main Fireworks Canvas -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Minimalist Window Header Bar -->
    <header class="terminal-header">
      <div class="header-left">
        <div class="window-controls">
          <span class="win-dot win-close"></span>
          <span class="win-dot win-min"></span>
          <span class="win-dot win-max"></span>
        </div>
        <div class="terminal-title">
          <span>ascii-fireworks</span>
          <span class="path-badge">~/show</span>
        </div>
      </div>

      <div class="header-right">
        <div class="stat-item">
          <span>fps:</span> <span class="val" id="fpsValue">60</span>
        </div>
        <div class="stat-item">
          <span>rockets:</span> <span class="val" id="rocketsValue">0</span>
        </div>
        <div class="stat-item">
          <span>particles:</span> <span class="val" id="particlesValue">0</span>
        </div>
      </div>
    </header>

    <!-- Top Action Toolbar -->
    <div class="action-toolbar">
      <button class="btn btn-primary" id="startShowBtn" title="Bắn pháo hoa">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        <span>Start Show</span>
      </button>

      <button class="btn btn-ghost" id="configModalBtn" title="Tùy biến chi tiết (Alt+Q)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span>Config <kbd>Alt+Q</kbd></span>
      </button>

      <button class="btn btn-ghost" id="guideBtn" title="Hướng dẫn & Thuật ngữ">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Guide</span>
      </button>

      <button class="btn btn-ghost" id="soundToggleBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <span>Audio: On</span>
      </button>

      <select class="theme-select" id="themeSelect">
        <option value="monochrome">Theme: Monochrome</option>
        <option value="slate">Theme: Nordic Slate</option>
        <option value="warm">Theme: Warm Charcoal</option>
      </select>

      <button class="btn btn-danger" id="clearBtn" title="Xóa màn hình">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>Clear</span>
      </button>
    </div>

    <!-- Subtle Help Tip -->
    <div class="minimal-tip">
      <span>Nhấn <kbd>Alt + Q</kbd> để tùy biến hoặc click chuột để bắn pháo hoa</span>
    </div>

    <!-- Terminal Bottom CLI Bar -->
    <div class="terminal-bottom-bar">
      <div class="cli-logs" id="terminalLogs">
        <!-- Log entries -->
      </div>
      <div class="cli-input-wrapper">
        <div class="cli-prompt">
          <span class="user">user@terminal</span>:<span>~</span>$
        </div>
        <input 
          type="text" 
          id="cliInput" 
          class="cli-input" 
          placeholder="Nhập lệnh (vd: start, config, guide, text I love you ♡, heart, preset champagne_finale, help)..." 
          autocomplete="off" 
          spellcheck="false"
        >
      </div>
    </div>
  </div>

  <!-- ALT + Q CUSTOMIZATION MODAL -->
  <div class="modal-backdrop" id="configModal">
    <div class="modal-dialog">
      <!-- Modal Header -->
      <div class="modal-header">
        <div class="modal-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
          <span>Fireworks Configuration</span>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Tabs Navigation -->
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="waves">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          <span>Waves & Stages</span>
        </button>
        <button class="tab-btn" data-tab="presets">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg>
          <span>Presets</span>
        </button>
        <button class="tab-btn" data-tab="guide">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Guide & Glossary</span>
        </button>
        <button class="tab-btn" data-tab="json">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <span>JSON Config</span>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <!-- TAB 1: Waves & Stages Sequencer -->
        <div class="tab-pane active" id="tab-waves">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <p style="font-size: 11.5px; color: var(--text-dim);">
              Đợt (Wave) = trình tự bắn; Lượt (Stages) = số lần nổ thứ cấp của từng quả pháo.
            </p>
            <button class="btn btn-primary" id="addWaveBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add Wave</span>
            </button>
          </div>

          <div class="waves-list" id="wavesContainer">
            <!-- Dynamic wave cards rendered via JS -->
          </div>
        </div>

        <!-- TAB 2: Presets -->
        <div class="tab-pane" id="tab-presets">
          <p style="font-size: 11.5px; color: var(--text-dim);">
            Chọn nhanh một kịch bản pháo hoa tối giản, nhẹ nhàng:
          </p>
          <div class="presets-grid" id="presetsContainer">
            <!-- Dynamic preset cards rendered via JS -->
          </div>
        </div>

        <!-- TAB 3: Guide & Glossary -->
        <div class="tab-pane" id="tab-guide">
          <div id="guideContainer">
            <!-- Rendered via JS -->
          </div>
        </div>

        <!-- TAB 4: JSON Import/Export -->
        <div class="tab-pane" id="tab-json">
          <div class="form-group">
            <label class="form-label">Configuration JSON</label>
            <textarea class="form-control" id="jsonConfigInput" rows="10" style="resize: vertical; font-size: 11px;"></textarea>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-ghost" id="exportJsonBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
              <span>Export</span>
            </button>
            <button class="btn btn-primary" id="importJsonBtn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>Import JSON</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <div class="footer-left">
          <button class="btn btn-ghost" id="testFireBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
            <span>Test Fire Show</span>
          </button>
        </div>
        <div class="footer-right">
          <button class="btn btn-primary" id="applyConfigBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>Save & Apply</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
